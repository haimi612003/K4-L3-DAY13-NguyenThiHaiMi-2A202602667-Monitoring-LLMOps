service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ ngưỡng 3000 ms là mức chờ tối đa người dùng chấp nhận. Baseline đo thực tế sau khi sửa
    (prompt có trên Langfuse, agent chạy trong threadpool): latency P50 ~157 ms, P95 ~170 ms,
    request đầu tiên sau khi khởi động (fetch prompt nguội) ~850–1300 ms, TTFT P95 ~55 ms.
    Practice rag_slow đẩy P95 lên ~2663 ms: vẫn dưới SLO nhưng gấp ~15 lần baseline, nên alert
    HighLatencyP95 dùng ngưỡng cảnh báo sớm 2000 ms thay vì chờ tới khi vi phạm SLO.
    Error budget 0.5% trong 28 ngày: với 10,000 request thì tối đa 50 request được phép lỗi hoặc
    chậm hơn 3000 ms. Request lỗi (request_failed) không có response_sent nên tự động là "bad event".
  error_budget_example:
    total_requests_28d: 10000
    allowed_bad_requests: 50
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
